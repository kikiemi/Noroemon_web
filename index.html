<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>黙々ノロえもん - Web Audio Workstation</title>
<meta name="description" content="ピッチ・テンポ独立変換、10バンドEQ、各種エフェクトを備えたブラウザ完結の音楽プレイヤー">
<meta name="theme-color" content="#fff4e8">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff7a1c'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%8E%9B%3C/text%3E%3C/svg%3E">
<script>
try {
  var s = JSON.parse(localStorage.getItem('wf-settings') || '{}')
  var t =
    s.theme === 'light'
      ? 'light'
      : s.theme === 'dark'
        ? 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
  document.documentElement.dataset.theme = t
} catch (e) {
  document.documentElement.dataset.theme = 'light'
}
</script>
<style>

:root {
  --bg: #fff4e8;
  --panel: #ffffff;
  --ink: #33261a;
  --sub: #8a7663;
  --line: #33261a;
  --accent: #ff7a1c;
  --accent-soft: #ffe3cc;
  --accent-contrast: #ffffff;
  --danger: #e04b3a;
  --radius: 14px;
  --font: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Yu Gothic UI', system-ui, sans-serif;
}
[data-theme="dark"] {
  --bg: #0a0a0a;
  --panel: #0f0f0f;
  --ink: #ffffff;
  --sub: #9a9a9a;
  --line: #ffffff;
  --accent: #ffffff;
  --accent-soft: #2a2a2a;
  --accent-contrast: #000000;
  --danger: #ff6b5e;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
}
button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}
button:disabled, .disabled { opacity: .45; pointer-events: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--accent-soft); border-radius: 999px; border: 2px solid var(--panel); }
::-webkit-scrollbar-track { background: transparent; }

.app-shell { height: 100%; display: flex; flex-direction: column; }
header.top {
  display: flex; align-items: center; gap: 10px;
  height: 52px;
  padding: 0 16px;
  border-bottom: 2px solid var(--line);
  background: var(--panel);
  flex-shrink: 0;
}
header.top h1 { font-size: 1.05rem; letter-spacing: .04em; }
header.top h1 .sub { font-size: .7rem; color: var(--sub); margin-left: 8px; font-weight: 400; }
header.top .spacer { flex: 1; }

.app-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 300px 1fr 340px;
  gap: 14px;
  padding: 14px;
  min-height: 0;
}
.panel {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 4px 0 var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-bottom: 2px solid var(--line);
  font-size: .85rem;
  font-weight: 700;
  flex-shrink: 0;
}
.panel-head .spacer { flex: 1; }
.center-panel { overflow-y: auto; padding: 14px; gap: 12px; }
.right-panel { overflow-y: auto; }
.right-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

.card {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--line);
  padding: 12px;
}
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: .8rem; font-weight: 700; }
.card-head .spacer { flex: 1; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: 0 3px 0 var(--line);
  transition: transform .06s, box-shadow .06s;
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.icon-btn.active { background: var(--accent); color: var(--accent-contrast); }
.chip-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 12px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  box-shadow: 0 2px 0 var(--line);
  font-size: .74rem;
  font-weight: 700;
  transition: transform .06s, box-shadow .06s;
}
.chip-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.chip-btn.active { background: var(--accent); color: var(--accent-contrast); }
.text-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: 0 3px 0 var(--line);
  font-size: .8rem;
  font-weight: 700;
  transition: transform .06s, box-shadow .06s;
}
.text-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

.now-playing { display: flex; flex-direction: column; gap: 8px; }
#track-name {
  font-size: 1.05rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.info-chip {
  padding: 4px 10px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--accent-soft);
  font-size: .7rem;
  font-weight: 700;
  min-height: 1.5em;
}
#pitch-display:empty::before { content: '♪ --'; color: var(--sub); }

#viz-container { height: 110px; }
.vz-canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
#waveform-area { height: 96px; }
.wf-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
.time-row {
  display: flex; align-items: center; gap: 8px;
  font-variant-numeric: tabular-nums;
  font-size: .8rem; font-weight: 700;
  margin-top: 8px;
}
.time-row .spacer { flex: 1; }
#time-total { color: var(--sub); }

#transport {
  display: flex; align-items: center; justify-content: center;
  gap: 12px;
  padding: 4px 0;
}
.play-btn {
  width: 64px; height: 64px;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-contrast);
  box-shadow: 0 4px 0 var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .06s, box-shadow .06s;
}
.play-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

#param-area { display: flex; justify-content: space-evenly; gap: 8px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 3px; user-select: none; }
.knob-label { font-size: .72rem; font-weight: 700; color: var(--sub); }
.knob-svg { width: 78px; height: 78px; cursor: ns-resize; touch-action: none; }
.knob-track { stroke: var(--accent-soft); stroke-width: 11; fill: none; stroke-linecap: round; }
.knob-arc { stroke: var(--accent); stroke-width: 11; fill: none; stroke-linecap: round; }
.knob-disc { fill: var(--panel); stroke: var(--line); stroke-width: 2.5; }
.knob-needle { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.knob-val {
  width: 74px; text-align: center;
  background: transparent; border: none;
  font-family: inherit; font-size: .74rem; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.knob-val:focus { outline: 2px solid var(--accent); border-radius: 6px; }

.hslider { display: grid; grid-template-columns: 88px 1fr 64px; align-items: center; gap: 8px; padding: 6px 0; }
.hs-label { font-size: .74rem; font-weight: 700; color: var(--sub); }
.hs-track {
  position: relative; height: 14px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--accent-soft);
  cursor: pointer;
  touch-action: none;
}
.hs-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
.hs-thumb {
  position: absolute; top: 50%; width: 22px; height: 22px;
  transform: translate(-50%, -50%);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 50%;
  box-shadow: 0 2px 0 var(--line);
  pointer-events: none;
}
.hs-val {
  text-align: right;
  background: transparent; border: none;
  font-family: inherit; font-size: .72rem; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.hs-val:focus { outline: 2px solid var(--accent); border-radius: 6px; }

.eq-bank { display: flex; gap: 6px; justify-content: space-between; height: 150px; }
.eq-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.eq-bar {
  position: relative; width: 100%; max-width: 22px; flex: 1;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--accent-soft);
  cursor: ns-resize;
  touch-action: none;
  overflow: hidden;
}
.eq-zero { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); opacity: .35; }
.eq-fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); }
.eq-freq { font-size: .6rem; color: var(--sub); font-weight: 700; }
select {
  font-family: inherit; font-size: .74rem; font-weight: 700;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 5px 8px;
}

.pl-tabs {
  display: flex; gap: 6px;
  padding: 10px;
  overflow-x: auto;
  flex-shrink: 0;
  border-bottom: 2px solid var(--line);
}
.pl-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  font-size: .72rem; font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 2px 0 var(--line);
}
.pl-tab.active { background: var(--accent); color: var(--accent-contrast); }
.pl-tab-del { display: inline-flex; opacity: .8; }
.pl-scroll { flex: 1; overflow-y: auto; position: relative; }
.track-list { position: relative; list-style: none; }
.track-item {
  position: absolute; left: 0; right: 0; height: 52px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px;
  border-bottom: 1px solid var(--accent-soft);
  cursor: pointer;
}
.track-item:hover { background: var(--accent-soft); }
.track-item.playing { background: var(--accent-soft); }
.track-item-idx { width: 22px; text-align: right; font-size: .7rem; color: var(--sub); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.track-item-name { flex: 1; font-size: .78rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-item-dur { font-size: .68rem; color: var(--sub); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.track-item-del { display: inline-flex; padding: 6px; color: var(--sub); flex-shrink: 0; border-radius: 8px; }
.track-item-del:hover { color: var(--danger); background: var(--panel); }
.track-item-rename { display: inline-flex; padding: 6px; color: var(--sub); flex-shrink: 0; border-radius: 8px; }
.track-item-rename:hover { color: var(--accent); background: var(--panel); }
.pl-empty { padding: 24px 16px; font-size: .76rem; color: var(--sub); text-align: center; }
.track-item-eq { display: none; align-items: flex-end; gap: 2px; height: 14px; width: 14px; flex-shrink: 0; }
.track-item.playing .track-item-eq { display: inline-flex; }
.track-item-eq span { width: 3px; background: var(--accent); transform-origin: bottom; animation: eqbounce 1s infinite ease-in-out; }
.track-item-eq span:nth-child(1) { height: 60%; animation-delay: 0s; }
.track-item-eq span:nth-child(2) { height: 100%; animation-delay: .2s; }
.track-item-eq span:nth-child(3) { height: 40%; animation-delay: .4s; }
@keyframes eqbounce { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }
[data-theme="dark"] .track-item-eq span { background: var(--ink); }

.toast {
  position: fixed; bottom: 84px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--accent);
  color: var(--accent-contrast);
  border: 2px solid var(--line);
  box-shadow: 0 3px 0 var(--line);
  padding: 10px 20px;
  border-radius: 999px;
  font-size: .78rem; font-weight: 700;
  z-index: 9999;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  max-width: 92vw;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); color: #fff; }

.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .4);
}
.modal {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 5px 0 var(--line);
  padding: 20px;
  width: min(400px, 92vw);
  max-height: 82vh;
  overflow-y: auto;
}
.modal h3 { font-size: .95rem; margin-bottom: 14px; color: var(--accent); }
[data-theme="dark"] .modal h3 { color: var(--ink); }
.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 44px;
  font-size: .8rem; font-weight: 700;
  cursor: pointer;
}
.set-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.set-storage { margin: 12px 0; font-size: .8rem; font-weight: 700; }
.storage-track {
  margin-top: 8px; height: 12px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--accent-soft);
  overflow: hidden;
}
.storage-bar { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
.storage-bar.warn { background: var(--danger); }
.storage-label { margin-top: 5px; font-size: .7rem; color: var(--sub); font-weight: 400; }
.modal-close {
  margin-top: 14px; width: 100%;
  padding: 11px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-contrast);
  box-shadow: 0 3px 0 var(--line);
  font-size: .82rem; font-weight: 700;
}
.modal-close:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

#splash {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px;
  background: var(--bg);
  cursor: pointer;
  user-select: none;
}
.splash-logo {
  width: 120px; height: 120px;
  border: 2px solid var(--line);
  border-radius: 28px;
  background: var(--accent);
  box-shadow: 0 6px 0 var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 58px;
}
.splash-title { font-size: 1.3rem; font-weight: 700; letter-spacing: .06em; }
.splash-sub { font-size: .76rem; color: var(--sub); }
.splash-tap {
  margin-top: 8px;
  padding: 12px 28px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  box-shadow: 0 3px 0 var(--line);
  font-size: .85rem; font-weight: 700;
  animation: tapblink 1.6s infinite;
}
@keyframes tapblink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.fatal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  padding: 16px;
}
.fatal-box {
  background: var(--panel);
  border: 2px solid var(--danger);
  border-radius: var(--radius);
  box-shadow: 0 4px 0 var(--danger);
  padding: 20px;
  max-width: 560px; width: 100%;
}
.fatal-box h2 { font-size: 1rem; color: var(--danger); margin-bottom: 10px; }
.fatal-box pre {
  font-size: .68rem; white-space: pre-wrap; word-break: break-all;
  max-height: 40vh; overflow-y: auto;
  background: var(--accent-soft);
  border-radius: 8px; padding: 10px;
  margin-bottom: 12px;
}
.fatal-box button {
  padding: 10px 18px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-contrast);
  box-shadow: 0 3px 0 var(--line);
  font-size: .8rem; font-weight: 700;
}

.bottom-nav {
  display: none;
  flex-shrink: 0;
  border-top: 2px solid var(--line);
  background: var(--panel);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav { min-height: 54px; }
.bottom-nav button {
  flex: 1;
  padding: 8px 0 6px;
  font-size: .7rem; font-weight: 700;
  color: var(--sub);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.bottom-nav button.active { color: var(--accent); }
[data-theme="dark"] .bottom-nav button.active { color: var(--ink); }

@media (max-width: 900px) {
  .app-grid { grid-template-columns: 1fr; padding: 10px; gap: 10px; position: relative; }
  .left-panel, .right-panel {
    position: fixed;
    top: 54px;
    bottom: calc(54px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    z-index: 20;
    border-radius: 0;
    border-left: none; border-right: none;
    box-shadow: none;
    transition: transform .22s ease;
  }
  .left-panel { transform: translateX(-102%); }
  .right-panel { transform: translateX(102%); }
  body[data-view="playlist"] .left-panel { transform: translateX(0); }
  body[data-view="fx"] .right-panel { transform: translateX(0); }
  .bottom-nav { display: flex; }
  #param-area { flex-wrap: wrap; }
  header.top h1 .sub { display: none; }
}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">🎛️</div>
  <div class="splash-title">黙々ノロえもん</div>
  <div class="splash-sub">Web Audio Workstation</div>
  <div class="splash-tap">タップして開始</div>
</div>

<div class="app-shell">
  <header class="top">
    <h1>黙々ノロえもん<span class="sub">Web Audio Workstation</span></h1>
    <span class="spacer"></span>
    <button id="btn-theme" class="icon-btn" title="テーマ切替">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 2v14a7 7 0 010-14z" fill="currentColor"/></svg>
    </button>
    <button id="btn-settings" class="icon-btn" title="設定">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="app-grid">

        <aside class="panel left-panel">
      <div class="panel-head">
        <span>プレイリスト</span>
        <span class="spacer"></span>
        <button id="btn-add-playlist" class="chip-btn" title="プレイリスト追加">＋ 追加</button>
      </div>
      <div id="playlist-list" style="flex:1;display:flex;flex-direction:column;min-height:0;"></div>
    </aside>

        <section class="panel center-panel" style="display:flex;flex-direction:column;">
      <div class="card now-playing">
        <div id="track-name">曲を選んでください</div>
        <div class="chip-row">
          <span id="bpm-display" class="info-chip">-- BPM</span>
          <span id="pitch-display" class="info-chip"></span>
        </div>
      </div>

      <div class="card" id="viz-container"></div>

      <div class="card">
        <div id="waveform-area"></div>
        <div class="time-row">
          <span id="time-current">0:00.0</span>
          <span>/</span>
          <span id="time-total">0:00.0</span>
          <span class="spacer"></span>
          <button id="btn-ab-clear" class="chip-btn" title="A-Bループ解除">ABクリア</button>
        </div>
      </div>

      <div id="transport">
        <button id="btn-prev" class="icon-btn" title="前の曲">
          <svg viewBox="0 0 24 24" width="18" height="18"><polygon points="17,18 9,12 17,6" fill="currentColor"/><rect x="5" y="6" width="2.5" height="12" fill="currentColor"/></svg>
        </button>
        <button id="btn-stop" class="icon-btn" title="停止">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button id="btn-play" class="play-btn" title="再生 / 一時停止">
          <svg viewBox="0 0 24 24" width="26" height="26"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg>
        </button>
        <button id="btn-next" class="icon-btn" title="次の曲">
          <svg viewBox="0 0 24 24" width="18" height="18"><polygon points="7,6 15,12 7,18" fill="currentColor"/><rect x="16.5" y="6" width="2.5" height="12" fill="currentColor"/></svg>
        </button>
        <button id="btn-loop-mode" class="icon-btn" title="ループ: なし"></button>
        <button id="btn-play-mode" class="icon-btn" title="再生順: リスト順"></button>
      </div>

      <div class="action-row">
        <button id="btn-open" class="text-btn" title="音声ファイルを開く">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          開く
        </button>
        <button id="btn-mic" class="text-btn" title="マイク入力">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2a3 3 0 013 3v7a3 3 0 01-6 0V5a3 3 0 013-3z" fill="currentColor"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v3M8 22h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          マイク
        </button>
        <button id="btn-export" class="text-btn" title="現在の設定でWAV書き出し">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          WAV
        </button>
      </div>

      <div class="card" id="param-area"></div>
    </section>

        <aside class="panel right-panel">
      <div class="panel-head"><span>エフェクト</span></div>
      <div class="right-body">
        <div class="chip-row">
          <button id="btn-vocal" class="chip-btn" title="ボーカルキャンセル">ボーカル消し</button>
          <button id="btn-reverse" class="chip-btn" title="逆再生">逆再生</button>
          <button id="btn-formant" class="chip-btn" title="ピッチ変更時に声質を保つ">フォルマント</button>
        </div>

        <div class="card">
          <div class="card-head">
            <span>リバーブ / ビットクラッシャー</span>
            <span class="spacer"></span>
            <button id="btn-bc-toggle" class="chip-btn" title="ビットクラッシャー ON/OFF">BC</button>
          </div>
          <div id="fx-area"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <span>イコライザ</span>
            <span class="spacer"></span>
            <select id="eq-preset-select"><option value="">プリセット</option></select>
          </div>
          <div id="eq-area"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <span>モジュレーション</span>
            <span class="spacer"></span>
            <select id="mod-mode-select">
              <option value="fl">フランジャー</option>
              <option value="ch">コーラス</option>
              <option value="ph">フェイザー</option>
            </select>
            <button id="btn-mod-toggle" class="chip-btn" title="モジュレーション ON/OFF">ON</button>
          </div>
          <div id="mod-area" style="display:flex;justify-content:space-evenly;flex-wrap:wrap;gap:4px;"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <span>コンプレッサー</span>
            <span class="spacer"></span>
            <button id="btn-comp-toggle" class="chip-btn" title="コンプレッサー ON/OFF">ON</button>
          </div>
          <div id="comp-area"></div>
        </div>
      </div>
    </aside>

  </main>

  <nav class="bottom-nav">
    <button id="nav-playlist">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.5" fill="currentColor"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor"/><circle cx="4.5" cy="18" r="1.5" fill="currentColor"/></svg>
      リスト
    </button>
    <button id="nav-player" class="active">
      <svg viewBox="0 0 24 24" width="20" height="20"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg>
      プレイヤー
    </button>
    <button id="nav-fx">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="10" r="2" fill="currentColor"/><circle cx="20" cy="14" r="2" fill="currentColor"/></svg>
      FX
    </button>
  </nav>
</div>

<script type="module" src="./dist/main.js"></script>
</body>
</html>
