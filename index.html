<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>黙々ノロえもん - Web Audio Workstation</title>
<meta name="description" content="ピッチ・テンポ独立変換、AI音源分離、耳コピ練習機能、10バンドEQと各種エフェクトを備えたブラウザ完結の音楽プレイヤー">
<meta name="theme-color" content="#fff4e8">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<script>
try {
  var s = JSON.parse(localStorage.getItem('wf-settings') || '{}')
  var t =
    s.theme === 'light'
      ? 'light'
      : s.theme === 'dark'
        ? 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
  document.documentElement.dataset.theme = t
} catch (e) {
  document.documentElement.dataset.theme = 'light'
}
</script>
<style>

:root {
  --bg: #fff4e8;
  --panel: #ffffff;
  --ink: #33261a;
  --sub: #8a7663;
  --line: #33261a;
  --accent: #ff7a1c;
  --accent-soft: #ffe3cc;
  --accent-contrast: #ffffff;
  --danger: #e04b3a;
  --radius: 14px;
  --font: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Yu Gothic UI', system-ui, sans-serif;
}
[data-theme="dark"] {
  --bg: #0a0a0a;
  --panel: #0f0f0f;
  --ink: #ffffff;
  --sub: #9a9a9a;
  --line: #ffffff;
  --accent: #ffffff;
  --accent-soft: #2a2a2a;
  --accent-contrast: #000000;
  --danger: #ff6b5e;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  overscroll-behavior: none;
}
button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}
button:disabled, .disabled { opacity: .45; pointer-events: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--accent-soft); border-radius: 999px; border: 2px solid var(--panel); }
::-webkit-scrollbar-track { background: transparent; }

.app-shell { height: 100%; display: flex; flex-direction: column; }
header.top {
  display: flex; align-items: center; gap: 10px;
  height: 52px;
  padding: 0 16px;
  border-bottom: 2px solid var(--line);
  background: var(--panel);
  flex-shrink: 0;
}
header.top h1 { font-size: 1.05rem; letter-spacing: .04em; }
header.top h1 .sub { font-size: .7rem; color: var(--sub); margin-left: 8px; font-weight: 400; }
header.top .spacer { flex: 1; }

.app-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 300px 1fr 340px;
  gap: 14px;
  padding: 14px;
  min-height: 0;
}
.panel {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 4px 0 var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-bottom: 2px solid var(--line);
  font-size: .85rem;
  font-weight: 700;
  flex-shrink: 0;
}
.panel-head .spacer { flex: 1; }
.center-panel { overflow-y: auto; padding: 14px; gap: 12px; }
.right-panel { overflow-y: auto; }
.right-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

.card {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--line);
  padding: 12px;
}
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: .8rem; font-weight: 700; }
.card-head .spacer { flex: 1; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: 0 3px 0 var(--line);
  transition: transform .06s, box-shadow .06s;
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.icon-btn.active { background: var(--accent); color: var(--accent-contrast); }
.chip-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 12px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  box-shadow: 0 2px 0 var(--line);
  font-size: .74rem;
  font-weight: 700;
  transition: transform .06s, box-shadow .06s;
}
.chip-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
.chip-btn.active { background: var(--accent); color: var(--accent-contrast); }
.text-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: 0 3px 0 var(--line);
  font-size: .8rem;
  font-weight: 700;
  transition: transform .06s, box-shadow .06s;
}
.text-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

.now-playing { display: flex; flex-direction: column; gap: 8px; }
#track-name {
  font-size: 1.05rem; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.info-chip {
  padding: 4px 10px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--accent-soft);
  font-size: .7rem;
  font-weight: 700;
  min-height: 1.5em;
}
#pitch-display:empty::before { content: '♪ --'; color: var(--sub); }

#viz-container { height: 110px; }
.vz-canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
#waveform-area { height: 96px; }
.wf-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
.time-row {
  display: flex; align-items: center; gap: 8px;
  font-variant-numeric: tabular-nums;
  font-size: .8rem; font-weight: 700;
  margin-top: 8px;
}
.time-row .spacer { flex: 1; }
#time-total { color: var(--sub); }

#transport {
  display: flex; align-items: center; justify-content: center;
  gap: 12px;
  padding: 4px 0;
}
.play-btn {
  width: 64px; height: 64px;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-contrast);
  box-shadow: 0 4px 0 var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .06s, box-shadow .06s;
}
.play-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

#param-area { display: flex; justify-content: space-evenly; gap: 8px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 3px; user-select: none; }
.knob-label { font-size: .72rem; font-weight: 700; color: var(--sub); }
.knob-svg { width: 78px; height: 78px; cursor: ns-resize; touch-action: none; }
.knob-track { stroke: var(--accent-soft); stroke-width: 11; fill: none; stroke-linecap: round; }
.knob-arc { stroke: var(--accent); stroke-width: 11; fill: none; stroke-linecap: round; }
.knob-disc { fill: var(--panel); stroke: var(--line); stroke-width: 2.5; }
.knob-needle { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.knob-val {
  width: 74px; text-align: center;
  background: transparent; border: none;
  font-family: inherit; font-size: .74rem; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.knob-val:focus { outline: 2px solid var(--accent); border-radius: 6px; }

.hslider { display: grid; grid-template-columns: 88px 1fr 64px; align-items: center; gap: 8px; padding: 6px 0; }
.hs-label { font-size: .74rem; font-weight: 700; color: var(--sub); }
.hs-track {
  position: relative; height: 14px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--accent-soft);
  cursor: pointer;
  touch-action: none;
}
.hs-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
.hs-thumb {
  position: absolute; top: 50%; width: 22px; height: 22px;
  transform: translate(-50%, -50%);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 50%;
  box-shadow: 0 2px 0 var(--line);
  pointer-events: none;
}
.hs-val {
  text-align: right;
  background: transparent; border: none;
  font-family: inherit; font-size: .72rem; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.hs-val:focus { outline: 2px solid var(--accent); border-radius: 6px; }

.eq-bank { display: flex; gap: 6px; justify-content: space-between; height: 150px; }
.eq-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.eq-bar {
  position: relative; width: 100%; max-width: 22px; flex: 1;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--accent-soft);
  cursor: ns-resize;
  touch-action: none;
  overflow: hidden;
}
.eq-zero { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--line); opacity: .35; }
.eq-fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); }
.eq-freq { font-size: .6rem; color: var(--sub); font-weight: 700; }
select {
  font-family: inherit; font-size: .74rem; font-weight: 700;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 5px 8px;
}

.pl-tabs {
  display: flex; gap: 6px;
  padding: 10px;
  overflow-x: auto;
  flex-shrink: 0;
  border-bottom: 2px solid var(--line);
}
.pl-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  font-size: .72rem; font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 2px 0 var(--line);
}
.pl-tab.active { background: var(--accent); color: var(--accent-contrast); }
.pl-tab-del { display: inline-flex; opacity: .8; }
.pl-scroll { flex: 1; overflow-y: auto; position: relative; }
.track-list { position: relative; list-style: none; }
.track-item {
  position: absolute; left: 0; right: 0; height: 52px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px;
  border-bottom: 1px solid var(--accent-soft);
  cursor: pointer;
}
.track-item:hover { background: var(--accent-soft); }
.track-item.playing { background: var(--accent-soft); }
.track-item-idx { width: 22px; text-align: right; font-size: .7rem; color: var(--sub); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.track-item-name { flex: 1; font-size: .78rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-item-dur { font-size: .68rem; color: var(--sub); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.track-item-del { display: inline-flex; padding: 6px; color: var(--sub); flex-shrink: 0; border-radius: 8px; }
.track-item-del:hover { color: var(--danger); background: var(--panel); }
.track-item-rename { display: inline-flex; padding: 6px; color: var(--sub); flex-shrink: 0; border-radius: 8px; }
.track-item-rename:hover { color: var(--accent); background: var(--panel); }
.pl-empty { padding: 24px 16px; font-size: .76rem; color: var(--sub); text-align: center; }
.panel-head .chip-btn { padding: 6px 10px; }
.track-item-grip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 40px;
  margin-left: -4px;
  color: var(--sub);
  flex-shrink: 0;
  border-radius: 8px;
  cursor: grab;
  touch-action: none;
}
.track-item-grip:hover { color: var(--accent); background: var(--panel); }
.track-item-grip:active { cursor: grabbing; }
.track-item.dragging {
  z-index: 5;
  background: var(--accent-soft);
  border-radius: 10px;
  border-bottom-color: transparent;
  box-shadow: 0 3px 0 var(--line);
  cursor: grabbing;
}
.track-item-eq { display: none; align-items: flex-end; gap: 2px; height: 14px; width: 14px; flex-shrink: 0; }
.track-item.playing .track-item-eq { display: inline-flex; }
.track-item-eq span { width: 3px; background: var(--accent); transform-origin: bottom; animation: eqbounce 1s infinite ease-in-out; }
.track-item-eq span:nth-child(1) { height: 60%; animation-delay: 0s; }
.track-item-eq span:nth-child(2) { height: 100%; animation-delay: .2s; }
.track-item-eq span:nth-child(3) { height: 40%; animation-delay: .4s; }
@keyframes eqbounce { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }
[data-theme="dark"] .track-item-eq span { background: var(--ink); }

.toast {
  position: fixed; bottom: 84px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--accent);
  color: var(--accent-contrast);
  border: 2px solid var(--line);
  box-shadow: 0 3px 0 var(--line);
  padding: 10px 20px;
  border-radius: 999px;
  font-size: .78rem; font-weight: 700;
  z-index: 9999;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  max-width: 92vw;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--danger); color: #fff; }

.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .4);
}
.modal {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 5px 0 var(--line);
  padding: 20px;
  width: min(400px, 92vw);
  max-height: 82vh;
  overflow-y: auto;
}
.modal h3 { font-size: .95rem; margin-bottom: 14px; color: var(--accent); }
[data-theme="dark"] .modal h3 { color: var(--ink); }
.set-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 44px;
  font-size: .8rem; font-weight: 700;
  cursor: pointer;
}
.set-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.set-storage { margin: 12px 0; font-size: .8rem; font-weight: 700; }
.storage-track {
  margin-top: 8px; height: 12px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--accent-soft);
  overflow: hidden;
}
.storage-bar { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
.storage-bar.warn { background: var(--danger); }
.storage-label { margin-top: 5px; font-size: .7rem; color: var(--sub); font-weight: 400; }
.modal-close {
  margin-top: 14px; width: 100%;
  padding: 11px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-contrast);
  box-shadow: 0 3px 0 var(--line);
  font-size: .82rem; font-weight: 700;
}
.modal-close:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

.fatal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  padding: 16px;
}
.fatal-box {
  background: var(--panel);
  border: 2px solid var(--danger);
  border-radius: var(--radius);
  box-shadow: 0 4px 0 var(--danger);
  padding: 20px;
  max-width: 560px; width: 100%;
}
.fatal-box h2 { font-size: 1rem; color: var(--danger); margin-bottom: 10px; }
.fatal-box pre {
  font-size: .68rem; white-space: pre-wrap; word-break: break-all;
  max-height: 40vh; overflow-y: auto;
  background: var(--accent-soft);
  border-radius: 8px; padding: 10px;
  margin-bottom: 12px;
}
.fatal-box button {
  padding: 10px 18px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-contrast);
  box-shadow: 0 3px 0 var(--line);
  font-size: .8rem; font-weight: 700;
}

.bottom-nav {
  display: none;
  flex-shrink: 0;
  border-top: 2px solid var(--line);
  background: var(--panel);
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav { min-height: 54px; }
.bottom-nav button {
  flex: 1;
  padding: 8px 0 6px;
  font-size: .7rem; font-weight: 700;
  color: var(--sub);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.bottom-nav button.active { color: var(--accent); }
[data-theme="dark"] .bottom-nav button.active { color: var(--ink); }


.card-head .card-title { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
.card-head .chip-btn { padding: 6px 10px; }
.card[data-card] > .card-head { gap: 6px; }
.card-head select { padding-left: 6px; padding-right: 6px; }
.card-head .card-title svg { transition: transform .15s; color: var(--sub); flex-shrink: 0; }
.card.collapsed .card-head { margin-bottom: 0; }
.card.collapsed .card-head .card-title svg { transform: rotate(-90deg); }
.card.collapsed > :not(.card-head) { display: none !important; }
.chip-btn, .text-btn, .pl-tab, .info-chip { white-space: nowrap; }
.chip-sm { padding: 5px 9px; min-width: 30px; justify-content: center; }
.sel-row { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 8px; padding: 6px 0; }
.sel-row .hs-label { white-space: nowrap; }
.sel-row select { width: 100%; min-width: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
.hslider.compact { grid-template-columns: 58px 1fr 46px; }
.stem-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; }
.stem-row .chip-btn { padding: 4px 8px; font-size: .68rem; }
.sep-status { font-size: .72rem; font-weight: 700; color: var(--sub); min-height: 1.2em; line-height: 1.5; }
.sep-bar-track { margin: 8px 0 4px; height: 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.sep-bar { height: 100%; width: 0%; background: var(--accent); transition: width .25s; }
.panel-head select, .card-head select { max-width: 130px; min-width: 0; }
#time-row-tools { display: inline-flex; gap: 6px; flex-shrink: 0; }
.now-playing .chip-row { flex-wrap: nowrap; min-width: 0; }
.now-playing .info-chip { flex-shrink: 0; }
#pitch-display { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.wf-card { container-type: inline-size; }
#param-area { container-type: inline-size; }
#param-area .knob-svg { width: clamp(56px, 21cqw, 78px); height: clamp(56px, 21cqw, 78px); }
#param-area .knob-val { width: clamp(54px, 21cqw, 74px); }
@container (max-width: 360px) {
  #btn-ab-clear .ab-word { display: none; }
  .time-row { gap: 6px; }
}
.drop-overlay {
  position: fixed; inset: 0; z-index: 150;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .35);
  pointer-events: none;
}
.drop-box {
  padding: 26px 34px;
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: 0 5px 0 var(--line);
  font-size: .95rem; font-weight: 700;
}
.modal h4 { font-size: .8rem; margin: 16px 0 4px; color: var(--sub); }
.set-row select { max-width: 60%; }
.set-btns { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
.kbd-list { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .74rem; padding: 4px 0; }
.kbd-list kbd {
  font-family: inherit; font-size: .7rem; font-weight: 700;
  padding: 1px 7px; border: 2px solid var(--line); border-radius: 6px; background: var(--accent-soft);
  white-space: nowrap; justify-self: start;
}

@media (max-width: 900px) {
  .app-grid { grid-template-columns: 1fr; padding: 10px; gap: 10px; position: relative; }
  .left-panel, .right-panel {
    position: fixed;
    top: 54px;
    bottom: calc(54px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    z-index: 20;
    border-radius: 0;
    border-left: none; border-right: none;
    box-shadow: none;
    transition: transform .22s ease;
  }
  .left-panel { transform: translateX(-102%); }
  .right-panel { transform: translateX(102%); }
  body[data-view="playlist"] .left-panel { transform: translateX(0); }
  body[data-view="fx"] .right-panel { transform: translateX(0); }
  .bottom-nav { display: flex; }
  #param-area { flex-wrap: wrap; }
  header.top h1 .sub { display: none; }
}
</style>
</head>
<body>

<div class="app-shell">
  <header class="top">
    <h1>黙々ノロえもん<span class="sub">Web Audio Workstation</span></h1>
    <span class="spacer"></span>
    <button id="btn-theme" class="icon-btn" title="テーマ切替">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 2v14a7 7 0 010-14z" fill="currentColor"/></svg>
    </button>
    <button id="btn-settings" class="icon-btn" title="設定">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10.47 5.27 L10.80 2.17 L13.20 2.17 L13.53 5.27 L14.64 5.63 L15.67 6.16 L18.10 4.20 L19.80 5.90 L17.84 8.33 L18.37 9.36 L18.73 10.47 L21.83 10.80 L21.83 13.20 L18.73 13.53 L18.37 14.64 L17.84 15.67 L19.80 18.10 L18.10 19.80 L15.67 17.84 L14.64 18.37 L13.53 18.73 L13.20 21.83 L10.80 21.83 L10.47 18.73 L9.36 18.37 L8.33 17.84 L5.90 19.80 L4.20 18.10 L6.16 15.67 L5.63 14.64 L5.27 13.53 L2.17 13.20 L2.17 10.80 L5.27 10.47 L5.63 9.36 L6.16 8.33 L4.20 5.90 L5.90 4.20 L8.33 6.16 L9.36 5.63 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </header>

  <main class="app-grid">

        <aside class="panel left-panel">
      <div class="panel-head">
        <span>プレイリスト</span>
        <span class="spacer"></span>
        <button id="btn-add-track" class="chip-btn" title="このプレイリストに曲を追加">＋ 曲</button>
        <button id="btn-add-playlist" class="chip-btn" title="プレイリストを追加">＋ リスト</button>
      </div>
      <div id="playlist-list" style="flex:1;display:flex;flex-direction:column;min-height:0;"></div>
    </aside>

        <section class="panel center-panel" style="display:flex;flex-direction:column;">
      <div class="card now-playing">
        <div id="track-name">読み込み中…</div>
        <div class="chip-row">
          <span id="bpm-display" class="info-chip">-- BPM</span>
          <span id="key-display" class="info-chip" title="推定キー（ピッチ変更後）">Key --</span>
          <span id="pitch-display" class="info-chip"></span>
        </div>
      </div>

      <div class="card" id="viz-container"></div>

      <div class="card wf-card">
        <div id="waveform-area"></div>
        <div class="time-row">
          <span id="time-current">0:00.0</span>
          <span>/</span>
          <span id="time-total">0:00.0</span>
          <span class="spacer"></span>
          <span id="time-row-tools">
            <button id="btn-set-a" class="chip-btn chip-sm" title="現在位置をAに設定 ( [ )">A</button>
            <button id="btn-set-b" class="chip-btn chip-sm" title="現在位置をBに設定 ( ] )">B</button>
            <button id="btn-marker" class="chip-btn chip-sm" title="現在位置にマーカーを追加 (M)・マーカーを右クリックで削除">◆</button>
            <button id="btn-ab-clear" class="chip-btn" title="A-Bループ解除">AB<span class="ab-word">クリア</span></button>
          </span>
        </div>
      </div>

      <div id="transport">
        <button id="btn-prev" class="icon-btn" title="前の曲">
          <svg viewBox="0 0 24 24" width="18" height="18"><polygon points="17,18 9,12 17,6" fill="currentColor"/><rect x="5" y="6" width="2.5" height="12" fill="currentColor"/></svg>
        </button>
        <button id="btn-stop" class="icon-btn" title="停止">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button id="btn-play" class="play-btn" title="再生 / 一時停止">
          <svg viewBox="0 0 24 24" width="26" height="26"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg>
        </button>
        <button id="btn-next" class="icon-btn" title="次の曲">
          <svg viewBox="0 0 24 24" width="18" height="18"><polygon points="7,6 15,12 7,18" fill="currentColor"/><rect x="16.5" y="6" width="2.5" height="12" fill="currentColor"/></svg>
        </button>
        <button id="btn-loop-mode" class="icon-btn" title="ループ: なし"></button>
        <button id="btn-play-mode" class="icon-btn" title="再生順: リスト順"></button>
      </div>

      <div class="action-row">
        <button id="btn-open" class="text-btn" title="音声ファイルを開く">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          開く
        </button>
        <button id="btn-mic" class="text-btn" title="マイク入力">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2a3 3 0 013 3v7a3 3 0 01-6 0V5a3 3 0 013-3z" fill="currentColor"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v3M8 22h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          マイク
        </button>
        <button id="btn-export" class="text-btn" title="現在の設定でWAV書き出し">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          WAV
        </button>
      </div>

      <div class="card" id="param-area"></div>
    </section>

        <aside class="panel right-panel">
      <div class="panel-head">
        <span>エフェクト</span>
        <span class="spacer"></span>
        <select id="preset-select" title="設定のプリセット"><option value="">プリセット</option></select>
        <button id="btn-reset-all" class="chip-btn" title="すべてのエフェクトを初期値に戻す">リセット</button>
      </div>
      <div class="right-body">
        <div class="chip-row">
          <button id="btn-vocal" class="chip-btn" title="ボーカルキャンセル（低音は残す）">ボーカル消し</button>
          <button id="btn-reverse" class="chip-btn" title="逆再生">逆再生</button>
          <button id="btn-formant" class="chip-btn" title="ピッチ変更時に声質を保つ">フォルマント</button>
        </div>

        <div class="card" data-card="sep">
          <div class="card-head">
            <span class="card-title">AI音源分離</span>
            <span class="spacer"></span>
            <button id="btn-sep-run" class="chip-btn" title="AIで楽器ごとに分離する">分離する</button>
          </div>
          <div id="sep-area"></div>
        </div>

        <div class="card" data-card="rv">
          <div class="card-head">
            <span class="card-title">リバーブ / ビットクラッシャー</span>
            <span class="spacer"></span>
            <button id="btn-bc-toggle" class="chip-btn" title="ビットクラッシャー ON/OFF">BC</button>
          </div>
          <div class="sel-row">
            <span class="hs-label">響きの種類</span>
            <select id="reverb-type-select"></select>
          </div>
          <div id="fx-area"></div>
        </div>

        <div class="card" data-card="eq">
          <div class="card-head">
            <span class="card-title">イコライザ</span>
            <span class="spacer"></span>
            <select id="eq-preset-select"><option value="">プリセット</option></select>
          </div>
          <div id="eq-area"></div>
        </div>

        <div class="card" data-card="md">
          <div class="card-head">
            <span class="card-title">モジュレーション</span>
            <span class="spacer"></span>
            <select id="mod-mode-select">
              <option value="fl">フランジャー</option>
              <option value="ch">コーラス</option>
              <option value="ph">フェイザー</option>
              <option value="tr">トレモロ</option>
            </select>
            <button id="btn-mod-toggle" class="chip-btn" title="モジュレーション ON/OFF">ON</button>
          </div>
          <div id="mod-area" style="display:flex;justify-content:space-evenly;flex-wrap:wrap;gap:4px;"></div>
        </div>

        <div class="card" data-card="cp">
          <div class="card-head">
            <span class="card-title">コンプレッサー</span>
            <span class="spacer"></span>
            <button id="btn-comp-toggle" class="chip-btn" title="コンプレッサー ON/OFF">ON</button>
          </div>
          <div id="comp-area"></div>
        </div>

        <div class="card" data-card="dl">
          <div class="card-head">
            <span class="card-title">ディレイ / エコー</span>
            <span class="spacer"></span>
            <button id="btn-delay-toggle" class="chip-btn" title="ディレイ ON/OFF">ON</button>
          </div>
          <div class="sel-row">
            <span class="hs-label">プリセット</span>
            <select id="delay-preset-select"><option value="">選んでください</option></select>
          </div>
          <div id="delay-area"></div>
        </div>

        <div class="card" data-card="ds">
          <div class="card-head">
            <span class="card-title">ディストーション</span>
            <span class="spacer"></span>
            <button id="btn-dist-toggle" class="chip-btn" title="ディストーション ON/OFF">ON</button>
          </div>
          <div id="dist-area"></div>
        </div>

        <div class="card" data-card="st">
          <div class="card-head">
            <span class="card-title">ステレオ / パン</span>
          </div>
          <div class="sel-row">
            <span class="hs-label">チャンネル</span>
            <select id="ch-mode-select">
              <option value="0">ステレオ</option>
              <option value="1">モノラル</option>
              <option value="2">左のみ</option>
              <option value="3">右のみ</option>
              <option value="4">左右入れ替え</option>
            </select>
          </div>
          <div id="stereo-area"></div>
        </div>

        <div class="card" data-card="pr">
          <div class="card-head">
            <span class="card-title">練習</span>
            <span class="spacer"></span>
            <button id="btn-click" class="chip-btn" title="曲の拍に合わせたクリック音">クリック</button>
          </div>
          <div class="sel-row">
            <span class="hs-label">特殊再生</span>
            <select id="special-select"></select>
          </div>
          <div id="practice-area"></div>
        </div>
      </div>
    </aside>

  </main>

  <nav class="bottom-nav">
    <button id="nav-playlist">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.5" fill="currentColor"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor"/><circle cx="4.5" cy="18" r="1.5" fill="currentColor"/></svg>
      リスト
    </button>
    <button id="nav-player" class="active">
      <svg viewBox="0 0 24 24" width="20" height="20"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg>
      プレイヤー
    </button>
    <button id="nav-fx">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="10" r="2" fill="currentColor"/><circle cx="20" cy="14" r="2" fill="currentColor"/></svg>
      FX
    </button>
  </nav>
</div>

<script type="module" src="./dist/main.js"></script>
</body>
</html>
